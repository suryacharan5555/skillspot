<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSpot 2.0</title>
    <meta name="description" content="A multi-organization scalable platform to transform SkillSpot into a centralized skill ecosystem. It hosts multiple NGOs/training centers, each managing their own skill programs and student communities under a unified, tenant-based architecture." />
    <meta property="og:title" content="SkillSpot 2.0" />
    <meta property="og:description" content="A multi-organization scalable platform to transform SkillSpot into a centralized skill ecosystem." />
    <meta name="theme-color" content="#1e1b4b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    <script>
      // Immediately apply saved theme to prevent flash of wrong theme
      try {
        var rawTheme = localStorage.getItem('skillspot_theme');
        var theme = 'light';
        if (rawTheme) {
          try {
            theme = JSON.parse(rawTheme);
          } catch (_) {
            theme = rawTheme;
          }
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
      // Register service worker for offline viewing of credentials
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
